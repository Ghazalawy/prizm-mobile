name: Build APK and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  API_URL: https://ms.prizm-energy.com

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute build metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install missing peer/build deps (Expo SDK matrix)
        run: npx expo install react-native-worklets babel-preset-expo expo-local-authentication expo-file-system expo-intent-launcher @tanstack/react-query react-native-toast-message @react-native-community/datetimepicker expo-image-picker expo-document-picker

      - name: Validate Expo dependency matrix
        run: npx expo install --check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Write .env
        run: echo "EXPO_PUBLIC_API_URL=${{ env.API_URL }}" > .env

      - name: Inject build metadata into lib/build-info.ts
        run: |
          # Preserve the BUILD_FLAGS block from the committed file (per-module
          # native-readiness toggles) — we only overwrite BUILD_TIME / BUILD_SHA
          # / BUILD_VERSION / RELEASE_NOTES. This way enabling a module is a
          # one-line PR, not a workflow edit.
          #
          # RELEASE_NOTES comes from the TOP entry in CHANGELOG.json and gets
          # shown to staff as a "What's new" popup on first launch after an
          # update (gated by BUILD_SHA comparison vs. SecureStore in
          # lib/whats-new.ts).
          RELEASE_TITLE=$(jq -r '.releases[0].title // ""' CHANGELOG.json)
          RELEASE_HIGHLIGHTS=$(jq -c '.releases[0].highlights // []' CHANGELOG.json)
          {
            echo '// Auto-generated by CI. Do not edit by hand.'
            echo "export const BUILD_TIME    = \"${{ steps.meta.outputs.build_time }}\";"
            echo "export const BUILD_SHA     = \"${{ steps.meta.outputs.short_sha }}\";"
            echo "export const BUILD_VERSION = \"1.0.0+${{ steps.meta.outputs.short_sha }}\";"
            echo ""
            echo "export const RELEASE_NOTES = {"
            echo "  title: $(printf '%s' "$RELEASE_TITLE" | jq -R .),"
            echo "  highlights: $RELEASE_HIGHLIGHTS,"
            echo "};"
            echo ""
            # Re-emit the committed BUILD_FLAGS block verbatim
            awk '/^export const BUILD_FLAGS/,/^} as const;/' lib/build-info.ts
          } > lib/build-info.ts.new
          mv lib/build-info.ts.new lib/build-info.ts
          cat lib/build-info.ts

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee gradle-build.log
        shell: bash

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          retention-days: 7

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/prizm-mobile.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prizm-mobile-apk
          path: out/prizm-mobile.apk
          retention-days: 30

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (${{ steps.meta.outputs.short_sha }})"
          body: |
            Auto-built from `main` @ `${{ github.sha }}`
            Built at: ${{ steps.meta.outputs.build_time }}
            API: ${{ env.API_URL }}

            Install on Android: enable "Install unknown apps" for your browser, then tap the APK.
          files: out/prizm-mobile.apk
          make_latest: "true"

  deploy-pages:
    name: Deploy GitHub Pages
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp pages/index.html _site/index.html
          sed -i "s|__SHORT_SHA__|${{ needs.build-apk.outputs.short_sha }}|g" _site/index.html
          sed -i "s|__BUILD_TIME__|${{ needs.build-apk.outputs.build_time }}|g" _site/index.html

      - name: Render audit doc to HTML
        # docs/MODULE_AUDIT.md is our canonical anatomy doc — checked into
        # the repo, kept up to date at the end of every batch. Publish it
        # to Pages so admins can read it from any browser without git.
        # marked + gfm-style markdown + a styled wrapper matching the
        # landing page palette.
        run: |
          npm install --no-save marked@12
          node -e "
            const fs = require('fs');
            const { marked } = require('marked');
            marked.setOptions({ gfm: true, breaks: false });
            const md = fs.readFileSync('docs/MODULE_AUDIT.md', 'utf8');
            const body = marked.parse(md);
            const html = \`<!doctype html>
<html lang=\"en\">
<head>
  <meta charset=\"utf-8\">
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
  <title>Prizm Mobile — Module Audit</title>
  <style>
    :root {
      --bg: #0b1320;
      --bg-2: #111a2e;
      --fg: #e8ecf4;
      --fg-dim: #93a0bd;
      --accent: #4f8cff;
      --accent-2: #2dd4bf;
      --border: #1f2a44;
      --good: #2dd4bf;
      --warn: #f59e0b;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, Inter, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #1d2a4d 0%, var(--bg) 60%);
      color: var(--fg);
      min-height: 100vh;
      line-height: 1.6;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .topbar a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .topbar a:hover { text-decoration: underline; }
    h1 { font-size: 28px; margin: 16px 0 8px; letter-spacing: -0.01em; }
    h2 { font-size: 22px; margin: 36px 0 12px; padding-top: 20px; border-top: 1px solid var(--border); }
    h3 { font-size: 17px; margin: 24px 0 8px; color: var(--accent-2); }
    h4 { font-size: 14px; margin: 16px 0 6px; color: var(--fg-dim); }
    p, li { color: var(--fg); font-size: 14px; }
    blockquote {
      border-left: 3px solid var(--accent);
      margin: 16px 0;
      padding: 8px 16px;
      background: rgba(79, 140, 255, 0.06);
      color: var(--fg-dim);
      border-radius: 0 6px 6px 0;
    }
    code {
      background: rgba(255,255,255,0.06);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--accent-2);
    }
    pre {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      font-size: 12.5px;
    }
    pre code { background: transparent; padding: 0; color: var(--fg); }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 16px 0;
      font-size: 13px;
      background: var(--bg-2);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    th { background: rgba(255,255,255,0.04); color: var(--fg-dim); font-weight: 600; }
    a { color: var(--accent); }
    hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
    /* Status badge styling — match the icons used in the markdown */
    td:first-child + td + td:has(+ td + td + td + td:contains('🔴')) { /* not used; rely on emoji */ }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    @media (max-width: 720px) {
      .wrap { padding: 20px 14px 60px; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class=\"wrap\">
    <div class=\"topbar\">
      <a href=\"./index.html\">&larr; Back to install page</a>
      <span style=\"color: var(--fg-dim); font-size: 12px;\">build __SHORT_SHA__ · __BUILD_TIME__</span>
    </div>
    \${body}
  </div>
</body>
</html>\`;
            fs.writeFileSync('_site/audit.html', html);
            console.log('Rendered docs/MODULE_AUDIT.md -> _site/audit.html (' + html.length + ' bytes)');
          "
          sed -i "s|__SHORT_SHA__|${{ needs.build-apk.outputs.short_sha }}|g" _site/audit.html
          sed -i "s|__BUILD_TIME__|${{ needs.build-apk.outputs.build_time }}|g" _site/audit.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
